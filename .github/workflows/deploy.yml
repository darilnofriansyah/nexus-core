name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-api-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      ROVELLE_TEST_DATABASE_URL: postgresql://rovelle_test:rovelle_test@localhost:5432/rovelle_phase3a?schema=public
      ROVELLE_TEST_DATABASE_DISPOSABLE: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rovelle_phase3a
          POSTGRES_USER: rovelle_test
          POSTGRES_PASSWORD: rovelle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rovelle_test -d rovelle_phase3a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate disposable test database
        env:
          DATABASE_URL: ${{ env.ROVELLE_TEST_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Verify Codex worker isolation manifest
        run: npm run test:codex-worker:isolation

      - name: Build
        run: npm run build

      - name: Verify production entrypoint
        run: test -f dist/main.js

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Restart core-api
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && docker compose run --rm --build migrations && docker compose up -d --build core-api"
