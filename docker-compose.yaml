services:
  core-api:
    container_name: core-api
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${VEYRA_DB_USER}:${VEYRA_DB_PASSWORD}@postgres:5432/veyra
    expose:
      - "3000"
    networks:
      - veyra-network

  migrations:
    build:
      context: .
      target: migrate
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${VEYRA_DB_USER}:${VEYRA_DB_PASSWORD}@postgres:5432/veyra
    networks:
      - veyra-network

  render-worker:
    container_name: render-worker
    build:
      context: .
      dockerfile: Dockerfile.render-worker
    restart: unless-stopped
    stop_grace_period: 5m
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${VEYRA_DB_USER}:${VEYRA_DB_PASSWORD}@postgres:5432/veyra
    networks:
      - veyra-network

networks:
  veyra-network:
    external: true
